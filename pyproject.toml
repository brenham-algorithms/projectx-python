[project]
name = "projectx-client"
version = "0.1.0"
description = "Python client for ProjectX/TopstepX API"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["projectx_client*"]
